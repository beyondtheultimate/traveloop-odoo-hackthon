<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traveloop - Create Trip</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #f5f6fa;
            min-height: 100vh;
        }
        .navbar {
            background: linear-gradient(135deg, #667eea, #764ba2);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: white;
        }
        .navbar .logo { font-size: 24px; font-weight: bold; }
        .navbar a {
            color: white;
            text-decoration: none;
            background: rgba(255,255,255,0.2);
            padding: 8px 15px;
            border-radius: 20px;
        }
        .container {
            max-width: 600px;
            margin: 40px auto;
            padding: 0 20px;
        }
        .card {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }
        .card h2 {
            color: #333;
            margin-bottom: 25px;
            font-size: 24px;
        }
        label {
            display: block;
            color: #555;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 14px;
        }
        input, textarea {
            width: 100%;
            padding: 12px 15px;
            margin-bottom: 20px;
            border: 2px solid #eee;
            border-radius: 10px;
            font-size: 14px;
            outline: none;
            font-family: 'Segoe UI', sans-serif;
        }
        input:focus, textarea:focus { border-color: #667eea; }
        textarea { height: 100px; resize: none; }
        .dates {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover { opacity: 0.9; }
        .back {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #667eea;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="navbar">
        <div class="logo">✈️ Traveloop</div>
        <a href="/dashboard">Back to Dashboard</a>
    </div>
    <div class="container">
        <div class="card">
            <h2>🗺️ Plan a New Trip</h2>
            <form method="POST">
                <label>Trip Name</label>
                <input type="text" name="name" placeholder="e.g. Europe Summer 2025" required>
                <label>Description</label>
                <textarea name="description" placeholder="What's this trip about?"></textarea>
                <label>Travel Dates</label>
                <div class="dates">
                    <div>
                        <label>Start Date</label>
                        <input type="date" name="start_date" required>
                    </div>
                    <div>
                        <label>End Date</label>
                        <input type="date" name="end_date" required>
                    </div>
                </div>
                <button type="submit">Create Trip 🚀</button>
            </form>
            <a href="/dashboard" class="back">Cancel</a>
        </div>
    </div>
</body>
</html>
