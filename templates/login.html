<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traveloop - Login</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card {
            background: white;
            padding: 40px;
            border-radius: 20px;
            width: 400px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .logo {
            text-align: center;
            font-size: 32px;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 10px;
        }
        .subtitle {
            text-align: center;
            color: #888;
            margin-bottom: 30px;
        }
        input {
            width: 100%;
            padding: 12px 15px;
            margin-bottom: 15px;
            border: 2px solid #eee;
            border-radius: 10px;
            font-size: 14px;
            outline: none;
        }
        input:focus { border-color: #667eea; }
        input.error-field { border-color: #ff4757; }
        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover { opacity: 0.9; }
        .error {
            background: #ffe0e0;
            color: #e00;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
            text-align: center;
            font-size: 13px;
        }
        .field-error {
            color: #ff4757;
            font-size: 12px;
            margin-top: -10px;
            margin-bottom: 10px;
            display: none;
        }
        .link {
            text-align: center;
            margin-top: 20px;
            color: #888;
        }
        .link a { color: #667eea; text-decoration: none; font-weight: bold; }
        .forgot {
            text-align: right;
            margin-top: -10px;
            margin-bottom: 15px;
        }
        .forgot a { color: #667eea; font-size: 13px; text-decoration: none; }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">✈️ Traveloop</div>
        <div class="subtitle">Plan your perfect journey</div>
        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}
        <form method="POST" onsubmit="return validateForm()">
            <input type="email" name="email" id="email" placeholder="Email Address" required>
            <div class="field-error" id="email-error">Please enter a valid email!</div>
            <input type="password" name="password" id="password" placeholder="Password" required>
            <div class="field-error" id="password-error">Password cannot be empty!</div>
            <div class="forgot">
                <a href="#">Forgot Password?</a>
            </div>
            <button type="submit">Login</button>
        </form>
        <div class="link">
            Don't have an account? <a href="/signup">Sign Up</a>
        </div>
    </div>
    <script>
        function validateForm() {
            let valid = true;
            const email = document.getElementById('email');
            const password = document.getElementById('password');
            const emailError = document.getElementById('email-error');
            const passwordError = document.getElementById('password-error');

            // Reset errors
            emailError.style.display = 'none';
            passwordError.style.display = 'none';
            email.classList.remove('error-field');
            password.classList.remove('error-field');

            // Validate email
            if (!email.value.includes('@')) {
                emailError.style.display = 'block';
                email.classList.add('error-field');
                valid = false;
            }

            // Validate password
            if (password.value.length < 1) {
                passwordError.style.display = 'block';
                password.classList.add('error-field');
                valid = false;
            }

            return valid;
        }
    </script>
</body>
</html>
